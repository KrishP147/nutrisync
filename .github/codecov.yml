codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  status:
    project:
      default:
        target: 60%
        threshold: 2%
    patch:
      default:
        target: 70%

# Backend is now Supabase Edge Functions with no automated test/coverage
# suite (see docs/06-testing.md), so only frontend coverage is tracked.
flag_management:
  default_rules:
    carryforward: true

flags:
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "**/*.md"
  - "**/*.txt"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/__tests__/**"
  - "**/tests/**"
  - "backend/htmlcov/**"
  - "frontend/public/**"
  - "reference-files/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
